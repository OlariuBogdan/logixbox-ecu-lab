# Configurarea Alembic (migrarile bazei de date).
# Adresa bazei de date NU se scrie aici: este citita din DATABASE_URL (vezi alembic/env.py).
#
# Comenzi (din folderul principal al proiectului):
#   migrare noua dupa modificarea models.py:
#     docker exec -it is-ia-python alembic revision --autogenerate -m "adauga tabela X"
#   aplicarea migrarilor:
#     docker exec -it is-ia-python alembic upgrade head
#   istoricul migrarilor:
#     docker exec -it is-ia-python alembic history

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
